services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: counter_db

  hz1:
    image: hazelcast/hazelcast:5.3
  hz2:
    image: hazelcast/hazelcast:5.3
  hz3:
    image: hazelcast/hazelcast:5.3

  consul:
    image: hashicorp/consul:1.15
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -dev -client=0.0.0.0 -ui"

  consul-init:
    image: hashicorp/consul:1.15
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
    depends_on:
      - consul
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Consul..."
        until consul kv put config/hazelcast/members "hz1,hz2,hz3"; do sleep 1; done
        consul kv put config/mq/queue_name "counter_queue"
        echo "Consul initialized"

  logging-service:
    build: .
    command: python -m logging_service.logging_service
    environment:
      - CONSUL_HOST=consul
      - GRPC_PORT=50051
    depends_on:
      - consul
      - consul-init
      - hz1
      - hz2
      - hz3
    deploy:
      replicas: 3

  counter-service:
    build: .
    command: python -m counter_service.counter_service
    environment:
      - CONSUL_HOST=consul
      - DATABASE_URL=postgresql://user:pass@db:5432/counter_db
    depends_on:
      - consul
      - consul-init
      - db
      - hz1
      - hz2
      - hz3

  facade-service:
    build: .
    command: python -m facade_service.facade_service
    ports:
      - "8000:8000"
    environment:
      - CONSUL_HOST=consul
    depends_on:
      - consul
      - consul-init
      - logging-service
      - counter-service
